<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Dock Terminal — Spike T01</title>
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <span class="brand">Dock Terminal · Spike T01</span>
      <span id="leader" class="leader" hidden>Leader…</span>
      <span id="hint">Ctrl + Espace puis ←/→/o/j/c/x · Ctrl + P palette · Ctrl + Maj + C/V copier/coller</span>
      <span id="hello"></span>
    </header>
    <main id="panes"></main>
    <aside id="journal" hidden>
      <div class="journal-title">Journal de frappe</div>
      <ol id="journal-list"></ol>
    </aside>
    <footer id="statusbar"><span id="status">Connexion à l'hôte…</span></footer>
    <div id="palette" hidden>
      <input id="palette-input" type="text" placeholder="Commande…" autocomplete="off" spellcheck="false">
      <ul id="palette-list"></ul>
    </div>
  </div>
  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/addon-webgl.js"></script>
  <script src="vendor/xterm/addon-canvas.js"></script>
  <script src="vendor/xterm/addon-fit.js"></script>
  <script src="vendor/xterm/addon-unicode11.js"></script>
  <script src="vendor/xterm/addon-clipboard.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/pane.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
